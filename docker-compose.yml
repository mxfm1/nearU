version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api
      - NEXT_PUBLIC_ENVIRONMENT=develop
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: pnpm dev
    stdin_open: true
    tty: true
